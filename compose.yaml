services:

  python:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: transit-python

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./tests:/app/tests

    command: tail -f /dev/null

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: transit-jupyter

    ports:
      - "8888:8888"

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./notebooks:/app/notebooks

    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=transit-dev-token

  postgres:
    image: postgres:17

    container_name: transit-postgres

    environment:
      POSTGRES_DB: transit_db
      POSTGRES_USER: transit_user
      POSTGRES_PASSWORD: transit_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: